name: Cross-platform build and test

# Covers the projects that build outside Windows: the shared ReadyCode.Core library, the Avalonia
# front end, and both test suites. The WPF app is checked on Windows too (it compiles anywhere with
# EnableWindowsTargeting, but only Windows can run its tests meaningfully alongside it).

on:
  push:
    branches: [ main, macos-port ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The projects themselves target net8.0 (RollForward=Major lets that run on any newer
      # runtime), but *building* ReadyCode.Avalonia needs a newer SDK than that: Avalonia
      # 12.1.2's source generator requires a C# compiler newer than the one the 8.0 SDK bundles,
      # and fails with CS9057 (and then a cascade of missing-InitializeComponent errors) under a
      # pure 8.0 SDK. This has been passing here only because GitHub-hosted runner images also
      # carry newer preinstalled SDKs the .NET muxer picks up with no global.json to say
      # otherwise - installing 9.0.x explicitly makes that a stated requirement rather than an
      # accident of the runner image.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build - Avalonia front end
        run: dotnet build ReadyCode.Avalonia -c Release -warnaserror

      - name: Build - test projects
        run: |
          dotnet build ReadyCode.Tests/ReadyCode.Tests.csproj -c Release -warnaserror
          dotnet build ReadyCode.Avalonia.Tests/ReadyCode.Avalonia.Tests.csproj -c Release -warnaserror

      # The WPF app can't run here, but compiling it catches changes to the shared ReadyCode.Core
      # library that would break the Windows front end. Debug only: its Release configuration is a
      # self-contained win-x64 publish, which needs the Windows runtime packs.
      - name: Compile-check the WPF front end
        run: dotnet build ReadyCode/ReadyCode.csproj -c Debug -warnaserror -p:EnableWindowsTargeting=true

      - name: Test - shared core logic
        run: dotnet test ReadyCode.Tests/ReadyCode.Tests.csproj -c Release --no-build

      # Runs on Avalonia's headless platform with Skia, so no display is needed.
      - name: Test - Avalonia UI
        run: dotnet test ReadyCode.Avalonia.Tests/ReadyCode.Avalonia.Tests.csproj -c Release --no-build

      - name: Publish self-contained binary
        run: >
          dotnet publish ReadyCode.Avalonia -c Release --self-contained true
          -r ${{ matrix.os == 'macos-latest' && 'osx-arm64' || 'linux-x64' }}
          -o publish
